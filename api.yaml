
# Client flow: create a DRAFT, edit it, then synchronously run external checks and scoring.
openapi: 3.0.3
info:
  title: Alfa Smart Credit API
  version: 1.0.0
servers:
  - url: http://localhost:8000/api/v1
tags:
  - name: Auth
    description: Вход и данные текущего пользователя
  - name: Client
    description: Эндпоинты для клиента (доступны с ролью 'client')
  - name: Employee
    description: Эндпоинты для сотрудника банка (доступны с ролью 'employee')

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Вход по email и паролю
      description: Возвращает JWT и профиль пользователя с ролью из users.role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Для пользователя отсутствует связанный профиль клиента или сотрудника
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      tags: [Auth]
      summary: Текущий пользователь и профиль
      description: Возвращает user и связанный профиль client или employee из проверенного JWT.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Текущий пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUserResponse'
        '401':
          description: Токен отсутствует, недействителен или просрочен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================
  # КЛИЕНТСКИЕ ЭНДПОИНТЫ
  # ==========================================
  /products:
    get:
      tags: [Client]
      summary: Доступный продукт MVP
      responses:
        '200':
          description: Единственный кредитный продукт MVP
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

  /applications:
    get:
      tags: [Client]
      summary: Список всех заявок текущего клиента
      description: Возвращает все заявки профиля клиента, включая черновики.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список заявок текущего клиента
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationStatusResponse'
        '401':
          description: Токен отсутствует, недействителен или просрочен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Пользователь не является клиентом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Client]
      summary: Создание черновика кредитной заявки
      description: >-
        Создаёт заявку в статусе DRAFT. Для создания достаточно product_type.
        Сумма, срок и финансовые данные заполняются позже. client_id определяется
        по профилю clients, связанному с users.id из проверенного JWT.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '201':
          description: Черновик создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationStatusResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Токен действителен, но пользователь не является клиентом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка проверки входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /applications/{id}:
    get:
      tags: [Client]
      summary: Получение статуса заявки
      description: >-
        Клиент проверяет статус только своей заявки. Чужая или отсутствующая
        заявка возвращает 404.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '401':
          description: Токен отсутствует, недействителен или просрочен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Пользователь не является клиентом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Текущий статус заявки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationStatusResponse'
        '404':
          description: Заявка не найдена или недоступна текущему клиенту
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [Client]
      summary: Редактирование черновика
      description: Изменяет данные только собственной заявки со статусом DRAFT. version обязателен для защиты от перезаписи чужих изменений.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchApplicationRequest'
      responses:
        '200':
          description: Черновик обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationStatusResponse'
        '401':
          description: Токен отсутствует, недействителен или просрочен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Пользователь не является владельцем заявки или не является клиентом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка проверки входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Заявка не в статусе DRAFT или версия устарела
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /applications/{id}/submit:
    post:
      tags: [Client]
      summary: Отправка черновика на проверку
      description: >-
        Синхронно проверяет права, версию и состояние; вызывает моки ФНС/БКИ и
        evaluate_credit; сохраняет проверки, score, итоговый статус и историю
        одной транзакцией. Сумма должна быть 100000–5000000 рублей, срок — 6,
        12 или 24 месяца.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: version
          in: query
          required: false
          deprecated: true
          schema:
            type: integer
            minimum: 1
          description: Совместимость; основной контракт передаёт version в JSON.
      requestBody:
        required: false
        description: Передайте JSON с version; старый query поддерживается временно. Отсутствие версии или конфликт значений возвращает 422.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationVersion'
      responses:
        '200':
          description: Заявка отправлена на проверку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationStatusResponse'
        '401':
          description: Токен отсутствует, недействителен или просрочен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Пользователь не является клиентом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Заявка не найдена или недоступна текущему клиенту
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Заявка не в статусе DRAFT или версия устарела
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Сумма или срок отсутствуют либо не соответствуют ограничениям продукта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /applications/{id}/fill:
    post:
      tags: [Client]
      summary: Заполнение финансовых данных и повторная оценка
      description: >-
        Доступно владельцу заявки только в NEEDS_INFO. Необходимо заполнить все
        поля из missing_fields. Дополняет business_data, выполняет полный повтор
        ФНС/БКИ и evaluate_credit и атомарно сохраняет проверки, итог и историю.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FillApplicationRequest'
      responses:
        '200':
          description: Карточка заявки с результатами повторных проверок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationStatusResponse'
        '401':
          description: Токен отсутствует, недействителен или просрочен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Пользователь не является клиентом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Заявка не найдена или недоступна текущему клиенту
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Заявка не в NEEDS_INFO или версия устарела
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Финансовые данные отсутствуют или некорректны
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /applications/{id}/sign:
    post:
      tags: [Client]
      summary: Подписание и выдача одобренного кредита
      description: >-
        Только владелец заявки со статусом APPROVED. Атомарно переводит заявку
        в ISSUED и записывает signed_at, issued_at и историю. Это имитация
        подписания и выдачи; реальная ЭП и перевод денег не выполняются. Статуса
        SIGNED нет.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: version
          in: query
          required: false
          deprecated: true
          schema:
            type: integer
            minimum: 1
          description: Совместимость; основной контракт передаёт version в JSON.
      requestBody:
        required: false
        description: Передайте JSON с version; старый query поддерживается временно. Отсутствие версии или конфликт значений возвращает 422.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationVersion'
      responses:
        '200':
          description: Заявка переведена из APPROVED в ISSUED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationStatusResponse'
        '401':
          description: Токен отсутствует, недействителен или просрочен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Пользователь не является клиентом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Заявка не найдена или недоступна текущему клиенту
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Заявка не в APPROVED или версия устарела
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /applications/{id}/documents:
    post:
      tags: [Client]
      summary: Загрузка документа к заявке
      description: >-
        Клиент загружает файл как multipart/form-data. Сервер сохраняет файл
        во внешнем хранилище, а application_documents.file_url и метаданные —
        в БД. Клиент не задаёт file_url или status.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Идентификатор собственной заявки из applications.id.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadApplicationDocumentRequest'
      responses:
        '201':
          description: Файл сохранён и привязан к заявке
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDocument'
        '401':
          description: Токен отсутствует, недействителен или просрочен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Пользователь не является владельцем заявки или не является клиентом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Заявка не найдена или недоступна текущему клиенту
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Заявка закрыта отказом и больше не принимает документы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Файл превышает допустимый размер
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка проверки multipart/form-data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /applications/{id}/documents/{document_id}/file:
    get:
      tags: [Client]
      summary: Скачивание документа по заявке
      description: Файл доступен владельцу заявки и сотруднику банка; путь к файлу берётся только из хранилища сервера.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Идентификатор заявки из applications.id.
        - name: document_id
          in: path
          required: true
          schema:
            type: integer
          description: Идентификатор документа из application_documents.id.
      responses:
        '200':
          description: Бинарное содержимое файла
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: Токен отсутствует, недействителен или просрочен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Пользователь не владелец заявки и не сотрудник
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Заявка, документ или файл не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================
  # ЭНДПОИНТЫ СОТРУДНИКА 
  # ==========================================
  /employee/applications:
    get:
      tags: [Employee]
      summary: Очередь заявок на ручной разбор
      description: Доступна только пользователям с users.role = employee.
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [MANUAL_REVIEW, CHECKING, NEEDS_INFO, APPROVED, REJECTED, ISSUED]
            default: MANUAL_REVIEW
      responses:
        '401':
          description: Токен отсутствует, недействителен или просрочен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Список заявок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployeeApplicationShort'
        '403':
          description: Доступ запрещён (нет роли employee)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /employee/applications/{id}:
    get:
      tags: [Employee]
      summary: Карточка заявки (Скрининг + Скоринг)
      description: Доступна только пользователям с users.role = employee.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '401':
          description: Токен отсутствует, недействителен или просрочен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Пользователь не является сотрудником
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Полные данные заявки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeApplicationDetail'
        '404':
          description: Заявка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /employee/applications/{id}/action:
    post:
      tags: [Employee]
      summary: Действие сотрудника по заявке
      description: >-
        Доступно только сотрудникам при рассмотрении кредитного риска после
        успешного завершения обязательных проверок. Для технического сбоя
        доступен только retry-checks. При APPROVE действуют стоп-факторы,
        сумма ограничена запрошенной и лимитом продукта, а ставка фиксирована
        на 28% годовых. ID сотрудника и комментарий сохраняются в истории.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeActionRequest'
      responses:
        '401':
          description: Токен отсутствует, недействителен или просрочен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Пользователь не является сотрудником
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Действие успешно применено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationStatusResponse'
        '400':
          description: Некорректное действие (например, попытка одобрить уже отклоненную заявку)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Заявка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Решение недоступно до успешных обязательных проверок, при стоп-факторах, неверном статусе или устаревшей версии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Некорректные поля действия или сумма одобрения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /employee/applications/{id}/retry-checks:
    post:
      tags: [Employee]
      summary: Повтор технически неуспешных проверок
      description: >-
        Доступно в MANUAL_REVIEW для причины EXTERNAL_CHECK_UNAVAILABLE, если
        последняя попытка содержит TIMEOUT/ERROR. Новые проверки, результат,
        статус и история сохраняются одной транзакцией. Повторный сбой оставляет
        техническую причину и не превращается в кредитный отказ.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: version
          in: query
          required: false
          deprecated: true
          schema:
            type: integer
            minimum: 1
          description: Совместимость; основной контракт передаёт version в JSON.
      requestBody:
        required: false
        description: Передайте JSON с version; старый query поддерживается временно. Отсутствие версии или конфликт значений возвращает 422.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationVersion'
      responses:
        '200':
          description: Карточка заявки с результатом повторных проверок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationStatusResponse'
        '401':
          description: Токен отсутствует, недействителен или просрочен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Пользователь не является сотрудником
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Заявка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Неверный статус, нет неуспешных проверок или версия устарела
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

# ==========================================
# СХЕМЫ ДАННЫХ (DTO)
# ==========================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Проверяйте подпись и exp. Claims должны содержать sub (users.id) и role.
        Клиентские операции проверяют владение заявкой по clients.user_id и
        applications.client_id; операции сотрудника требуют role=employee.

  schemas:
    ApplicationVersion:
      type: object
      additionalProperties: false
      required:
      - version
      properties:
        version:
          type: integer
          minimum: 1
    CreditOffer:
      type: object
      required:
      - kind
      - amount
      - annual_rate_pct
      - term_months
      - monthly_payment
      - dscr
      - requested_dscr
      - target_dscr
      - monthly_cash_flow
      - existing_debt_payments
      - max_total_debt_service
      - explanation
      properties:
        kind:
          type: string
          enum:
          - ORIGINAL
          - COUNTER_OFFER
        amount:
          type: string
        annual_rate_pct:
          type: string
          description: 'Проценты годовых: строка 20.0000 означает 20%.'
        term_months:
          type: integer
          enum:
          - 6
          - 12
          - 24
        monthly_payment:
          type: string
        dscr:
          type: string
          description: Покрытие платежей на окончательных условиях, не ниже 1.35.
        requested_dscr:
          type: string
        target_dscr:
          type: string
        monthly_cash_flow:
          type: string
        existing_debt_payments:
          type: string
        max_total_debt_service:
          type: string
        explanation:
          type: string
    Product:
      type: object
      properties:
        id:
          type: string
          enum: [term_loan]
        name:
          type: string
          example: Кредит на оборотные средства
        min_amount:
          type: string
          example: "100000.00"
          description: Рубли; денежные значения передаются строками.
        max_amount:
          type: string
          example: "5000000.00"
        terms:
          type: array
          items:
            type: integer
            enum: [6, 12, 24]
        disbursement_count:
          type: integer
          enum: [1]
        term_type:
          type: string
          enum: [fixed]
        repayment_type:
          type: string
          enum: [annuity]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true

    AuthUser:
      type: object
      properties:
        id:
          type: integer
          description: Идентификатор из users.id.
        email:
          type: string
          format: email
        role:
          type: string
          enum: [client, employee]

    ClientProfile:
      type: object
      properties:
        id:
          type: integer
          description: Идентификатор из clients.id.
        inn:
          type: string
        company_name:
          type: string
        client_type:
          type: string
          enum: [INDIVIDUAL, LEGAL_ENTITY]

    EmployeeProfile:
      type: object
      properties:
        id:
          type: integer
          description: Идентификатор из employees.id.
        full_name:
          type: string
        position:
          type: string

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT; claims include sub (users.id), role and exp.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Срок действия access_token в секундах.
        user:
          $ref: '#/components/schemas/AuthUser'
        client:
          allOf:
            - $ref: '#/components/schemas/ClientProfile'
          type: object
          nullable: true
        employee:
          allOf:
            - $ref: '#/components/schemas/EmployeeProfile'
          type: object
          nullable: true

    AuthenticatedUserResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        client:
          allOf:
            - $ref: '#/components/schemas/ClientProfile'
          type: object
          nullable: true
        employee:
          allOf:
            - $ref: '#/components/schemas/EmployeeProfile'
          type: object
          nullable: true

    CreateApplicationRequest:
      type: object
      required: [product_type]
      additionalProperties: false
      description: Для создания черновика достаточно product_type=term_loan.
      properties:
        product_type:
          type: string
          enum: [term_loan]
          example: term_loan
        requested_amount:
          type: string
          nullable: true
          pattern: '^\d+(\.\d{1,2})?$'
          example: "1500000.00"
          description: Рубли; от 100000.00 до 5000000.00.
        requested_term_months:
          type: integer
          nullable: true
          enum: [6, 12, 24]
          example: 12
        purpose:
          type: string
          nullable: true
          example: "Пополнение оборотных средств"
        business_data:
          type: object
          description: 'Финансовые данные. Если их не передать, сервер сохранит {"financials": {}}.'
          default:
            financials: {}
          properties:
            financials:
              type: object
              properties:
                annual_revenue:
                  type: string
                  nullable: true
                annual_expenses:
                  type: string
                  nullable: true
          example:
            financials:
              annual_revenue: "5000000.00"
              annual_expenses: "300000.00"

    PatchApplicationRequest:
      type: object
      required: [version]
      minProperties: 2
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 1
          description: Текущая версия заявки из предыдущего ответа.
        requested_amount:
          type: string
          nullable: true
          pattern: '^\d+(\.\d{1,2})?$'
          description: Рубли; от 100000.00 до 5000000.00.
        requested_term_months:
          type: integer
          nullable: true
          enum: [6, 12, 24]
        purpose:
          type: string
          nullable: true
          maxLength: 500
        business_data:
          type: object
          properties:
            financials:
              type: object
              properties:
                annual_revenue:
                  type: string
                  nullable: true
                annual_expenses:
                  type: string
                  nullable: true

    FillApplicationRequest:
      type: object
      required: [version, business_data]
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 1
        business_data:
          type: object
          required: [financials]
          properties:
            financials:
              type: object
              minProperties: 1
              properties:
                annual_revenue:
                  type: string
                  nullable: true
                  pattern: '^\d+(\.\d{1,2})?$'
                annual_expenses:
                  type: string
                  nullable: true
                  pattern: '^\d+(\.\d{1,2})?$'

    UploadApplicationDocumentRequest:
      type: object
      required:
        - document_type
        - file
      properties:
        document_type:
          type: string
          example: charter
          description: Тип загружаемого документа.
        file:
          type: string
          format: binary
          description: Файл; сохраняется вне БД, а ссылка записывается в application_documents.file_url.

    EmployeeActionRequest:
      type: object
      required: [action, version]
      properties:
        action:
          type: string
          enum: [APPROVE, REJECT, REQUEST_INFO]
          example: "APPROVE"
        version:
          type: integer
          minimum: 1
          description: Текущая версия заявки из последнего ответа.
        missing_fields:
          type: array
          nullable: true
          items:
            type: string
            enum:
              - business_data.financials.annual_revenue
              - business_data.financials.annual_expenses
          description: Обязателен для REQUEST_INFO; сохраняется в applications.missing_fields.
        decision_reason_code:
          type: string
          nullable: true
          description: Сохраняется в applications.decision_reason_code; обязателен для REJECT или REQUEST_INFO.
          example: "HIGH_DEBT_LOAD"
        approved_amount:
          type: string
          nullable: true
          description: Сумма в рублях, сохраняется в applications.approved_amount.
          example: "1000000.00"
        approved_rate:
          type: string
          nullable: true
          description: Фиксированная ставка 28% годовых; если передана, должна быть равна 28.
          example: "28"
        comment:
          type: string
          example: "Снизили лимит из-за долговой нагрузки"

    ApplicationStatusResponse:
      type: object
      properties:
        id:
          type: integer
          description: Идентификатор из applications.id.
        product_type:
          type: string
          enum: [term_loan]
        requested_amount:
          type: string
          nullable: true
          example: "1500000.00"
        requested_term_months:
          type: integer
          nullable: true
        purpose:
          type: string
          nullable: true
        status:
          type: string
          enum: [DRAFT, CHECKING, NEEDS_INFO, MANUAL_REVIEW, APPROVED, REJECTED, ISSUED]
          example: "CHECKING"
        version:
          type: integer
          minimum: 1
          description: >-
            Начинается с 1 и атомарно увеличивается при изменении заявки.
            Optimistic locking возвращает 409 при устаревшей версии.
        business_data:
          type: object
          properties:
            financials:
              type: object
              properties:
                annual_revenue:
                  type: string
                  nullable: true
                annual_expenses:
                  type: string
                  nullable: true
        next_actions:
          type: array
          description: >-
            Действия, вычисленные для роли текущего пользователя и состояния:
            клиент DRAFT=[EDIT,SUBMIT], NEEDS_INFO=[FILL], APPROVED=[SIGN];
            сотрудник MANUAL_REVIEW при кредитном рассмотрении=
            [APPROVE,REJECT,REQUEST_INFO], при EXTERNAL_CHECK_UNAVAILABLE=
            [RETRY_CHECKS]; остальные сочетания возвращают пустой список.
          items:
            type: string
            enum: [EDIT, SUBMIT, FILL, APPROVE, REJECT, REQUEST_INFO, RETRY_CHECKS, SIGN]
        missing_fields:
          type: array
          items:
            type: string
        info_comment:
          type: string
          nullable: true
        score:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        risk_grade:
          type: string
          enum: [A, B, C, D, E]
          nullable: true
        decision_reason_code:
          type: string
          nullable: true
        scoring_result:
          type: object
          nullable: true
          description: >-
            Полный JSON результата расчета: модель, статус, score, reason_code,
            входные данные проверок и финансов, факторы принятия решения.
        approved_amount:
          type: string
          nullable: true
        approved_rate:
          type: string
          nullable: true
          example: "28.0000"
          description: Сервер фиксирует ставку 28% годовых при ручном одобрении.
        offer:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CreditOffer'
          description: Рассчитанное предложение; доступно в APPROVED и ISSUED.
        signed_at:
          type: string
          format: date-time
          nullable: true
          description: Время демонстрационной фиксации подписания.
        issued_at:
          type: string
          format: date-time
          nullable: true
          description: Время демонстрационной фиксации выдачи вместе с подписанием.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        documents:
          type: array
          description: Документы этой заявки и их статус обработки.
          items:
            $ref: '#/components/schemas/ApplicationDocument'
        checks:
          type: array
          description: Сохранённые результаты ФНС и БКИ, включая все попытки.
          items:
            $ref: '#/components/schemas/ApplicationCheck'
        status_history:
          type: array
          description: >-
            История изменений из application_status_history. comment последнего
            перехода содержит пояснение или запрос дополнительной информации.
          items:
            $ref: '#/components/schemas/ApplicationStatusHistoryEntry'

    EmployeeApplicationShort:
      type: object
      properties:
        id:
          type: integer
          description: Идентификатор из applications.id.
        company_name:
          type: string
          example: "ООО Ромашка"
        requested_amount:
          type: string
          example: "1500000.00"
          nullable: true
        risk_grade:
          type: string
          example: "C"
          nullable: true
        status:
          type: string
          example: "MANUAL_REVIEW"
        created_at:
          type: string
          format: date-time

    EmployeeApplicationDetail:
      type: object
      properties:
        id:
          type: integer
          description: Идентификатор из applications.id.
        status:
          type: string
          example: "MANUAL_REVIEW"
        version:
          type: integer
          minimum: 1
          description: Начинается с 1; атомарно увеличивается при изменении заявки.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        client_id:
          type: integer
          description: Внешний ключ из applications.client_id.
        client:
          type: object
          properties:
            id:
              type: integer
              description: Идентификатор из clients.id.
            inn:
              type: string
            company_name:
              type: string
            client_type:
              type: string
              enum: [INDIVIDUAL, LEGAL_ENTITY]
        product_type:
          type: string
          enum: [term_loan]
        requested_amount:
          type: string
          nullable: true
        requested_term_months:
          type: integer
          nullable: true
        purpose:
          type: string
          nullable: true
        business_data:
          type: object
          properties:
            financials:
              type: object
              properties:
                annual_revenue:
                  type: string
                  nullable: true
                annual_expenses:
                  type: string
                  nullable: true
        next_actions:
          type: array
          description: Доступные действия сотрудника для текущего состояния заявки.
          items:
            type: string
            enum: [EDIT, SUBMIT, FILL, APPROVE, REJECT, REQUEST_INFO, RETRY_CHECKS, SIGN]
        missing_fields:
          type: array
          items:
            type: string
        info_comment:
          type: string
          nullable: true
        score:
          type: integer
          nullable: true
        risk_grade:
          type: string
          enum: [A, B, C, D, E]
          nullable: true
        decision_reason_code:
          type: string
          nullable: true
        scoring_result:
          type: object
          nullable: true
          description: Полный JSON результата скоринга с входами и факторами расчета.
        approved_amount:
          type: string
          nullable: true
        approved_rate:
          type: string
          nullable: true
        signed_at:
          type: string
          format: date-time
          nullable: true
        issued_at:
          type: string
          format: date-time
          nullable: true
        checks:
          type: array
          description: Записи application_checks; содержимое response_data зависит от check_type.
          items:
            $ref: '#/components/schemas/ApplicationCheck'
        documents:
          type: array
          description: Записи application_documents.
          items:
            $ref: '#/components/schemas/ApplicationDocument'
        status_history:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationStatusHistoryEntry'

    ApplicationCheck:
      type: object
      properties:
        id:
          type: integer
          description: Идентификатор из application_checks.id.
        check_type:
          type: string
          enum: [FNS, BKI]
        status:
          type: string
          enum: [SUCCESS, TIMEOUT, ERROR]
        response_data:
          oneOf:
            - $ref: '#/components/schemas/FNSCheckResponse'
            - $ref: '#/components/schemas/BKICheckResponse'
          nullable: true
        created_at:
          type: string
          format: date-time

    FNSCheckResponse:
      type: object
      properties:
        is_active:
          type: boolean
          nullable: true
        business_age_months:
          type: integer
          nullable: true

    BKICheckResponse:
      type: object
      properties:
        current_overdue_days:
          type: integer
          nullable: true
        monthly_debt_payments:
          type: string
          nullable: true
          description: Сумма в рублях, JSON string.

    ApplicationDocument:
      type: object
      properties:
        id:
          type: integer
          description: Идентификатор из application_documents.id.
        document_type:
          type: string
        file_url:
          type: string
          format: uri-reference
        status:
          type: string
          enum: [PENDING, VERIFIED, REJECTED]
        created_at:
          type: string
          format: date-time

    ApplicationStatusHistoryEntry:
      type: object
      properties:
        id:
          type: integer
          description: Идентификатор из application_status_history.id.
        previous_status:
          type: string
          nullable: true
        new_status:
          type: string
        changed_by:
          type: string
          enum: [CLIENT, SYSTEM, EMPLOYEE]
        changed_by_user_id:
          type: integer
          nullable: true
          description: ID пользователя, выполнившего переход; для SYSTEM равен null.
        comment:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    # --- Общие ---
    ErrorResponse:
      type: object
      properties:
        error_code:
          type: string
          example: "VALIDATION_ERROR"
        message:
          type: string
          example: "Поле 'requested_amount' должно быть больше нуля."
        details:
          type: object
          nullable: true
