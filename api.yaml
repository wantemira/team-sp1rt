# Снимок FastAPI /openapi.json; обновление: docs/TEST_SCENARIOS.md
openapi: 3.1.0
info:
  title: Alfa Smart Credit API
  description: API для кредитного кабинета действующих клиентов и банковских сотрудников.
  version: 1.0.0
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Login
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Некорректные поля или действие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: Get Me
      operationId: get_me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUserResponse'
        '422':
          description: Некорректные поля или действие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/products:
    get:
      tags:
      - Client
      summary: Get Products
      description: Оборотный кредит и ограничения продукта.
      operationId: get_products_api_v1_products_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProductResponse'
                type: array
                title: Response Get Products Api V1 Products Get
        '422':
          description: Некорректные поля или действие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/news:
    get:
      tags:
      - Client
      summary: Get News
      description: Статическая синтетическая новость для кабинета клиента.
      operationId: get_news_api_v1_news_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Некорректные поля или действие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/applications:
    get:
      tags:
      - Client
      summary: List Applications
      operationId: list_applications_api_v1_applications_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ApplicationResponse'
                type: array
                title: Response List Applications Api V1 Applications Get
        '422':
          description: Некорректные поля или действие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
    post:
      tags:
      - Client
      summary: Create Application
      operationId: create_application_api_v1_applications_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '422':
          description: Некорректные поля или действие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/applications/{id}:
    get:
      tags:
      - Client
      summary: Get Application
      operationId: get_application_api_v1_applications__id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '422':
          description: Некорректные поля или действие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - Client
      summary: Patch Application
      operationId: patch_application_api_v1_applications__id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationPatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '422':
          description: Некорректные поля или действие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/applications/{id}/submit:
    post:
      tags:
      - Client
      summary: Submit Application
      operationId: submit_application_api_v1_applications__id__submit_post
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      - name: version
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          deprecated: true
          title: Version
        deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/ApplicationVersion'
              - type: 'null'
              title: Request
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '422':
          description: Некорректные поля или действие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/applications/{id}/fill:
    post:
      tags:
      - Client
      summary: Fill Application
      operationId: fill_application_api_v1_applications__id__fill_post
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationFill'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '422':
          description: Некорректные поля или действие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/applications/{id}/sign:
    post:
      tags:
      - Client
      summary: Sign Application
      operationId: sign_application_api_v1_applications__id__sign_post
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      - name: version
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          deprecated: true
          title: Version
        deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/ApplicationVersion'
              - type: 'null'
              title: Request
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '422':
          description: Некорректные поля или действие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/applications/{id}/documents:
    post:
      tags:
      - Client
      summary: Upload Document
      operationId: upload_document_api_v1_applications__id__documents_post
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_document_api_v1_applications__id__documents_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDocumentResponse'
        '422':
          description: Некорректные поля или действие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/applications/{id}/documents/{document_id}/file:
    get:
      tags:
      - Client
      summary: Download Document
      operationId: download_document_api_v1_applications__id__documents__document_id__file_get
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      - name: document_id
        in: path
        required: true
        schema:
          type: integer
          title: Document Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Некорректные поля или действие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/employee/applications:
    get:
      tags:
      - Employee
      summary: Get Queue
      operationId: get_queue_api_v1_employee_applications_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/QueueStatus'
          default: MANUAL_REVIEW
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployeeApplicationShort'
                title: Response Get Queue Api V1 Employee Applications Get
        '422':
          description: Некорректные поля или действие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/employee/applications/{id}:
    get:
      tags:
      - Employee
      summary: Get Application
      operationId: get_application_api_v1_employee_applications__id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeApplicationDetail'
        '422':
          description: Некорректные поля или действие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/employee/applications/{id}/action:
    post:
      tags:
      - Employee
      summary: Decide Application
      operationId: decide_application_api_v1_employee_applications__id__action_post
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeActionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '422':
          description: Некорректные поля или действие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/employee/applications/{id}/retry-checks:
    post:
      tags:
      - Employee
      summary: Retry Checks
      operationId: retry_checks_api_v1_employee_applications__id__retry_checks_post
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      - name: version
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          deprecated: true
          title: Version
        deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/ApplicationVersion'
              - type: 'null'
              title: Request
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '422':
          description: Некорректные поля или действие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health/db:
    get:
      tags:
      - Health
      summary: Health Db
      operationId: health_db_health_db_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Db Health Db Get
        '422':
          description: Некорректные поля или действие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ApplicationCheckResponse:
      properties:
        id:
          type: integer
          title: Id
        check_type:
          type: string
          title: Check Type
        status:
          type: string
          title: Status
        response_data:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Response Data
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - check_type
      - status
      - response_data
      - created_at
      title: ApplicationCheckResponse
    ApplicationCreate:
      properties:
        product_type:
          type: string
          const: term_loan
          title: Product Type
        requested_amount:
          anyOf:
          - anyOf:
            - type: number
            - type: string
            decimal_places: 2
            ge: '100000.00'
            le: '5000000.00'
            max_digits: 18
          - type: 'null'
          title: Requested Amount
        requested_term_months:
          anyOf:
          - type: integer
            enum:
            - 6
            - 12
            - 24
          - type: 'null'
          title: Requested Term Months
        purpose:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Purpose
        business_data:
          $ref: '#/components/schemas/BusinessData-Input'
      additionalProperties: false
      type: object
      required:
      - product_type
      title: ApplicationCreate
    ApplicationDocumentResponse:
      properties:
        id:
          type: integer
          title: Id
        document_type:
          type: string
          title: Document Type
        file_url:
          type: string
          title: File Url
        status:
          type: string
          title: Status
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - document_type
      - file_url
      - status
      - created_at
      title: ApplicationDocumentResponse
    ApplicationFill:
      properties:
        version:
          type: integer
          minimum: 1.0
          title: Version
        business_data:
          $ref: '#/components/schemas/BusinessData-Input'
      additionalProperties: false
      type: object
      required:
      - version
      - business_data
      title: ApplicationFill
    ApplicationPatch:
      properties:
        version:
          type: integer
          minimum: 1.0
          title: Version
        requested_amount:
          anyOf:
          - anyOf:
            - type: number
            - type: string
            decimal_places: 2
            ge: '100000.00'
            le: '5000000.00'
            max_digits: 18
          - type: 'null'
          title: Requested Amount
        requested_term_months:
          anyOf:
          - type: integer
            enum:
            - 6
            - 12
            - 24
          - type: 'null'
          title: Requested Term Months
        purpose:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Purpose
        business_data:
          $ref: '#/components/schemas/BusinessData-Input'
      additionalProperties: false
      type: object
      required:
      - version
      title: ApplicationPatch
    ApplicationResponse:
      properties:
        id:
          type: integer
          title: Id
        product_type:
          type: string
          title: Product Type
        requested_amount:
          anyOf:
          - type: string
          - type: 'null'
          title: Requested Amount
        requested_term_months:
          anyOf:
          - type: integer
          - type: 'null'
          title: Requested Term Months
        purpose:
          anyOf:
          - type: string
          - type: 'null'
          title: Purpose
        status:
          type: string
          title: Status
        business_data:
          additionalProperties: true
          type: object
        score:
          anyOf:
          - type: integer
          - type: 'null'
          title: Score
        risk_grade:
          anyOf:
          - type: string
          - type: 'null'
          title: Risk Grade
        decision_reason_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Decision Reason Code
        scoring_result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Scoring Result
        approved_amount:
          anyOf:
          - type: string
          - type: 'null'
          title: Approved Amount
        approved_rate:
          anyOf:
          - type: string
          - type: 'null'
          title: Approved Rate
        offer:
          anyOf:
          - $ref: '#/components/schemas/CreditOffer'
          - type: 'null'
        signed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Signed At
        issued_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Issued At
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        version:
          type: integer
          title: Version
        next_actions:
          items:
            type: string
          type: array
          title: Next Actions
        missing_fields:
          items:
            type: string
          type: array
          title: Missing Fields
        info_comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Info Comment
        documents:
          items:
            $ref: '#/components/schemas/ApplicationDocumentResponse'
          type: array
          title: Documents
        checks:
          items:
            $ref: '#/components/schemas/ApplicationCheckResponse'
          type: array
          title: Checks
        status_history:
          items:
            $ref: '#/components/schemas/ApplicationStatusHistoryResponse'
          type: array
          title: Status History
      type: object
      required:
      - id
      - product_type
      - requested_amount
      - requested_term_months
      - purpose
      - status
      - business_data
      - score
      - risk_grade
      - decision_reason_code
      - scoring_result
      - approved_amount
      - approved_rate
      - signed_at
      - issued_at
      - created_at
      - updated_at
      - version
      title: ApplicationResponse
    ApplicationStatusHistoryResponse:
      properties:
        id:
          type: integer
          title: Id
        previous_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Previous Status
        new_status:
          type: string
          title: New Status
        changed_by:
          type: string
          title: Changed By
        changed_by_user_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Changed By User Id
        comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - previous_status
      - new_status
      - changed_by
      - changed_by_user_id
      - comment
      - created_at
      title: ApplicationStatusHistoryResponse
    ApplicationVersion:
      properties:
        version:
          type: integer
          minimum: 1.0
          title: Version
      additionalProperties: false
      type: object
      required:
      - version
      title: ApplicationVersion
    AuthenticatedUserResponse:
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
        client:
          anyOf:
          - $ref: '#/components/schemas/ClientProfile'
          - type: 'null'
        employee:
          anyOf:
          - $ref: '#/components/schemas/EmployeeProfile'
          - type: 'null'
      type: object
      required:
      - user
      title: AuthenticatedUserResponse
    Body_upload_document_api_v1_applications__id__documents_post:
      properties:
        document_type:
          type: string
