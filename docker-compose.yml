services:
  db:
    image: postgres:16
    container_name: credit-db
    environment:
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: credit
      POSTGRES_DB: credit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit -d credit"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: credit-api
    environment:
      # ВАЖНО: внутри Docker-сети хост базы данных называется `db`, а не `localhost`
      - DATABASE_URL=postgresql+psycopg2://credit:credit@db:5432/credit
      - JWT_SECRET=super_secret_key_change_me_in_production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  pgdata: